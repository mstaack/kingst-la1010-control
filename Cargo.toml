[package]
name = "la1010"
version = "0.1.0"
edition = "2024"
description = "CLI and library for the Kingst LA1010 USB logic analyzer: capture, measure, decode UART/I2C/SPI/USB"
license = "MIT"
repository = "https://github.com/mstaack/kingst-la1010-control"
homepage = "https://github.com/mstaack/kingst-la1010-control"
readme = "README.md"
keywords = ["kingst", "la1010", "logic-analyzer", "protocol-decoder", "cli"]
categories = ["command-line-utilities", "hardware-support"]
rust-version = "1.85"
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
flate2 = "1.1"
nusb = "0.2.9"
object = "0.41"
serde_json = { version = "1", features = ["preserve_order"] }
tar = "0.4"
# native-tls: the vendor server (IIS 7.5) offers no TLS suite that rustls supports.
ureq = { version = "3.5", default-features = false, features = ["native-tls"] }
zip = { version = "9.7", default-features = false, features = ["deflate"] }

[dev-dependencies]
object = { version = "0.41", features = ["write"] }
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
